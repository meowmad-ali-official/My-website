<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Simple Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      min-height: 70vh;
      padding: 80px 10%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 600px;
      font-size: 18px;
      color: #666;
      margin-bottom: 25px;
    }

    .button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .about {
      background: white;
      padding: 60px 10%;
      text-align: center;
    }

    .about h2 {
      margin-bottom: 15px;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>MyWebsite</h1>

    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="home">
      <h2>Welcome to My Website</h2>

      <p>
        This is a simple website created using HTML, CSS, and JavaScript.
        You can customize the text, colors, and layout however you like.
      </p>

      <button class="button" onclick="showMessage()">
        Click Me
      </button>
    </section>

    <section class="about" id="about">
      <h2>About Us</h2>

      <p>
        We create simple, clean, and useful websites.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MyWebsite. All rights reserved.</p>
  </footer>

  <script>
    function showMessage() {
      alert("Thanks for visiting my website!");
    }
  </script>

</body>
</html>
