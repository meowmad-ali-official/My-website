<title>Meowmad's Website</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050510;
    color: white;
}

/* NAVIGATION */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0 8%;

    background: rgba(5,5,16,0.85);
    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(255,255,255,0.1);

    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #67e8f9;

    text-shadow:
        0 0 10px #06b6d4,
        0 0 20px #06b6d4;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    color: #67e8f9;
    text-shadow: 0 0 10px #06b6d4;
}

/* HERO */

.hero {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 100px 20px;

    background:
        radial-gradient(circle at 20% 20%, #7c3aed55, transparent 35%),
        radial-gradient(circle at 80% 80%, #06b6d455, transparent 35%),
        #050510;

    position: relative;
    overflow: hidden;
}

.hero-content {
    max-width: 900px;
