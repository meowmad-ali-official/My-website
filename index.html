<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashline</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080a12;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#080a12;
    cursor:pointer;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#title{
    position:absolute;
    top:18px;
    left:22px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:4px;
    opacity:.8;
}

#progressWrap{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(430px,55vw);
    height:5px;
    border:1px solid rgba(255,255,255,.15);
}

#progress{
    width:0%;
    height:100%;
    background:white;
}

#percent{
    position:absolute;
    top:31px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    letter-spacing:2px;
    opacity:.6;
}

#attempt{
    position:absolute;
    top:18px;
    right:22px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.55;
}

#message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    opacity:1;
    transition:.25s;
}

#message.hidden{
    opacity:0;
}

#message h1{
    font-size:clamp(38px,7vw,80px);
    letter-spacing:-4px;
}

#message p{
    margin-top:15px;
    font-size:11px;
    letter-spacing:3px;
    opacity:.55;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="title">DASHLINE</div>

    <div id="progressWrap">
        <div id="progress"></div>
    </div>

    <div id="percent">0%</div>

    <div id="attempt">ATTEMPT 1</div>

    <div id="message">
        <h1 id="messageTitle">DASHLINE</h1>
        <p id="messageText">CLICK OR PRESS SPACE TO START</p>
    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",resize);
resize();


/* =========================
   PLAYER
========================= */

const player = {

    x:120,
    y:0,

    size:32,

    vy:0,

    gravity:0.9,

    jumpPower:-15,

    grounded:true,

    rotation:0,

    alive:true

};


/* =========================
   GAME STATE
========================= */

let cameraX=0;

let speed=6.5;

let gameStarted=false;

let gameOver=false;

let completed=false;

let attempt=1;

let shake=0;

let particles=[];

let trail=[];

const levelLength=18500;


/* =========================
   LEVEL OBJECTS
========================= */

const platforms=[];
const spikes=[];
const pads=[];
const portals=[];
const blocks=[];


function platform(x,y,w,h=50){

    platforms.push({
        x,y,w,h
    });

}

function spike(x,y,size=38){

    spikes.push({
        x,y,size
    });

}

function pad(x,y,w=50){

    pads.push({
        x,y,w,h:10
    });

}

function portal(x,type){

    portals.push({
        x,
        type,
        used:false
    });

}

function block(x,y,w,h){

    blocks.push({
        x,y,w,h
    });

}


/* =========================
   LEVEL
========================= */

function buildLevel(){

    platforms.length=0;
    spikes.length=0;
    pads.length=0;
    portals.length=0;
    blocks.length=0;

    platform(-500,0,1200);

    spike(680,50);
    spike(730,50);

    platform(800,0,260);

    spike(1110,50);
    spike(1160,50);
    spike(1210,50);

    platform(1280,0,330);

    spike(1450,50);

    platform(1680,0,160);
    platform(1900,85,160);
    platform(2130,150,180);
    platform(2380,80,180);
    platform(2640,0,280);

    spike(2750,50);
    spike(2800,50);

    platform(3000,0,300);

    block(3150,50,45,90);
    block(3300,50,45,150);

    platform(3400,0,500);

    spike(3500,50);
    spike(3550,50);

    platform(3950,0,120);
    pad(4000,50);

    platform(4200,130,220);
    platform(4500,230,220);
    platform(4800,130,220);
    platform(5100,0,350);

    spike(5250,50);
    spike(5300,50);
    spike(5350,50);

    platform(5550,0,160);
    pad(5660,50);

    platform(5800,150,190);
    platform(6080,80,190);
    platform(6360,0,260);

    spike(6500,50);
    spike(6550,50);

    platform(6650,0,500);

    block(6700,50,50,130);
    block(6800,50,50,200);
    block(6900,50,50,130);

    portal(7200,"fast");

    platform(7100,0,1200);

    spike(7350,50);
    spike(7395,50);
    spike(7440,50);

    spike(7700,50);
    spike(7750,50);

    block(8000,50,55,140);

    spike(8250,50);
    spike(8300,50);
    spike(8350,50);

    portal(8500,"normal");

    platform(8400,0,300);

    platform(8800,100,160);
    platform(9050,170,160);
    platform(9300,100,160);

    platform(9550,0,300);

    spike(9680,50);
    spike(9730,50);

    platform(9900,0,180);
    pad(10050,50);

    platform(10300,150,190);
    platform(10600,70,190);
    platform(10900,0,300);

    spike(11050,50);
    spike(11100,50);
    spike(11150,50);

    platform(11400,0,800);

    for(let x=11550;x<12100;x+=110){
        spike(x,50);
    }

    portal(12300,"fast");

    platform(12200,0,1300);

    for(let x=12400;x<13400;x+=125){
        spike(x,50);
    }

    portal(13500,"normal");

    platform(13400,0,300);

    platform(13800,120,180);
    platform(14100,220,180);
    platform(14400,120,180);

    platform(14600,0,400);
    pad(14600,50);

    spike(14800,50);
    spike(14850,50);

    platform(15150,0,900);

    spike(15300,50);
    spike(15350,50);
    spike(15400,50);

    block(15600,50,50,150);
    block(15700,50,50,100);

    spike(15900,50);
    spike(15950,50);

    platform(16100,0,400);

    platform(16350,0,700);
    pad(16400,50);

    spike(16600,50);
    spike(16650,50);
    spike(16700,50);

    platform(16900,0,700);

    spike(17100,50);
    spike(17150,50);

    platform(17300,0,900);

    for(let x=17500;x<17900;x+=100){
        spike(x,50);
    }

    platform(18000,0,700);
}

buildLevel();


/* =========================
   UI
========================= */

const message=document.getElementById("message");
const messageTitle=document.getElementById("messageTitle");
const messageText=document.getElementById("messageText");

function showMessage(title,text){

    messageTitle.textContent=title;
    messageText.textContent=text;

    message.classList.remove("hidden");
}

function hideMessage(){

    message.classList.add("hidden");
}

function updateUI(){

    const percent=Math.min(
        100,
        Math.floor(player.x/levelLength*100)
    );

    document.getElementById("progress").style.width=
        percent+"%";

    document.getElementById("percent").textContent=
        percent+"%";

    document.getElementById("attempt").textContent=
        "ATTEMPT "+attempt;
}


/* =========================
   START / JUMP
========================= */

function jump(){

    /* If the game hasn't started,
       start it AND immediately jump. */

    if(!gameStarted){

        gameStarted=true;

        hideMessage();

        player.grounded=true;

        player.vy=player.jumpPower;

        return;
    }

    /* Restart after death */

    if(gameOver){

        restart();

        return;
    }

    /* Restart after completion */

    if(completed){

        restart();

        return;
    }

    /* Normal jump */

    if(player.grounded){

        player.vy=player.jumpPower;

        player.grounded=false;

        createJumpParticles();
    }
}


/* Mouse / touchscreen */

canvas.addEventListener("pointerdown",function(){

    jump();

});


/* Keyboard */

window.addEventListener("keydown",function(e){

    if(
        e.code==="Space" ||
        e.code==="ArrowUp" ||
        e.code==="KeyW"
    ){

        e.preventDefault();

        if(!e.repeat){

            jump();

        }
    }

});


/* =========================
   COLLISION
========================= */

function rectCollision(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}


function spikeCollision(s){

    const left=s.x;
    const right=s.x+s.size;

    const top=s.y;
    const bottom=s.y+s.size;

    const px=player.x;
    const py=player.y;

    return(
        px+player.size > left+5 &&
        px < right-5 &&
        py+player.size > top+8 &&
        py < bottom
    );
}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

    if(!gameStarted || gameOver || completed){
        return;
    }

    const oldY=player.y;

    player.x+=speed;

    player.vy+=player.gravity;

    player.y+=player.vy;

    player.grounded=false;


    const surfaces=[
        ...platforms,
        ...blocks
    ];


    /* Platform collision */

    for(const p of surfaces){

        const horizontal=
            player.x+player.size>p.x &&
            player.x<p.x+p.w;

        if(!horizontal) continue;


        const oldBottom=
            oldY+player.size;

        const newBottom=
            player.y+player.size;


        /* Landing */

        if(
            player.vy>=0 &&
            oldBottom<=p.y &&
            newBottom>=p.y
        ){

            player.y=p.y-player.size;

            player.vy=0;

            player.grounded=true;
        }


        /* Hitting underside */

        if(
            player.vy<0 &&
            oldY>=p.y+p.h &&
            player.y<=p.y+p.h
        ){

            player.y=p.y+p.h;

            player.vy=0;
        }

    }


    /* Jump pads */

    for(const p of pads){

        const touching=
            player.x+player.size>p.x &&
            player.x<p.x+p.w &&
            player.y+player.size>=p.y &&
            player.y+player.size<=p.y+20;

        if(touching){

            player.vy=-20;

            player.grounded=false;

            createJumpParticles();
        }
    }


    /* Spikes */

    for(const s of spikes){

        if(
            s.x<player.x+player.size &&
            s.x+s.size>player.x &&
            s.y<player.y+player.size &&
            s.y+s.size>player.y
        ){

            if(spikeCollision(s)){

                die();

                return;
            }
        }
    }


    /* Portals */

    for(const p of portals){

        if(!p.used && player.x>p.x){

            p.used=true;

            if(p.type==="fast"){
                speed=9;
            }

            if(p.type==="normal"){
                speed=6.5;
            }
        }
    }


    /* Falling */

    if(player.y<-300){

        die();

        return;
    }


    /* Rotation */

    if(!player.grounded){

        player.rotation+=0.15;

    }else{

        const snap=Math.PI/2;

        player.rotation=
            Math.round(player.rotation/snap)*snap;
    }


    /* Trail */

    trail.push({
        x:player.x,
        y:player.y,
        rotation:player.rotation,
        life:18
    });

    if(trail.length>20){
        trail.shift();
    }
}


/* =========================
   DEATH
========================= */

function die(){

    if(gameOver) return;

    gameOver=true;

    player.alive=false;

    shake=15;

    createDeathParticles();

    showMessage(
        "CRASHED",
        "CLICK OR PRESS SPACE TO RETRY"
    );
}


/* =========================
   RESTART
========================= */

function restart(){

    player.x=120;

    player.y=50-player.size;

    player.vy=0;

    player.grounded=true;

    player.rotation=0;

    player.alive=true;

    cameraX=0;

    speed=6.5;

    gameOver=false;

    completed=false;

    gameStarted=true;

    particles=[];
    trail=[];

    for(const p of portals){
        p.used=false;
    }

    attempt++;

    hideMessage();
}


/* =========================
   COMPLETE
========================= */

function finish(){

    completed=true;

    gameStarted=false;

    showMessage(
        "LEVEL COMPLETE",
        "CLICK OR PRESS SPACE TO PLAY AGAIN"
    );
}


/* =========================
   PARTICLES
========================= */

function particle(x,y,vx,vy,size,life){

    particles.push({
        x,
        y,
        vx,
        vy,
        size,
        life,
        maxLife:life
    });
}


function createJumpParticles(){

    for(let i=0;i<8;i++){

        particle(
            player.x+player.size/2,
            player.y,
            (Math.random()-.5)*3,
            Math.random()*2,
            Math.random()*4+2,
            25
        );
    }
}


function createDeathParticles(){

    for(let i=0;i<35;i++){

        particle(
            player.x+player.size/2,
            player.y+player.size/2,
            (Math.random()-.5)*9,
            (Math.random()-.5)*9,
            Math.random()*5+2,
            45
        );
    }
}


function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.15;

        p.life--;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }


    for(let i=trail.length-1;i>=0;i--){

        trail[i].life--;

        if(trail[i].life<=0){
            trail.splice(i,1);
        }
    }
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    const target=player.x-W*.30;

    cameraX+=(target-cameraX)*.12;

    if(cameraX<0){
        cameraX=0;
    }
}


/* =========================
   SCREEN COORDINATES
========================= */

function screenX(x){
    return x-cameraX;
}

function screenY(y){
    return H*.72-y;
}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

    const gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,"#090b18");
    gradient.addColorStop(.5,"#10152b");
    gradient.addColorStop(1,"#06070d");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);


    ctx.save();

    ctx.globalAlpha=.08;

    ctx.strokeStyle="#ffffff";

    const grid=50;

    const offset=-(cameraX%grid);

    for(let x=offset;x<W;x+=grid){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();
    }

    for(let y=0;y<H;y+=grid){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    ctx.restore();
}


/* =========================
   DRAW PLATFORM
========================= */

function drawPlatform(p){

    const x=screenX(p.x);

    const y=screenY(p.y);

    if(
        x>W+100 ||
        x+p.w<-100
    ){
        return;
    }

    ctx.fillStyle="#151b31";

    ctx.fillRect(
        x,
        y,
        p.w,
        p.h
    );

    ctx.strokeStyle="#46537f";

    ctx.strokeRect(
        x+.5,
        y+.5,
        p.w-1,
        p.h-1
    );

    ctx.fillStyle="#778cff";

    ctx.fillRect(
        x,
        y,
        p.w,
        2
    );
}


/* =========================
   DRAW SPIKE
========================= */

function drawSpike(s){

    const x=screenX(s.x);

    const y=screenY(s.y);

    if(
        x>W+100 ||
        x+s.size<-100
    ){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        x,
        y+s.size
    );

    ctx.lineTo(
        x+s.size/2,
        y
    );

    ctx.lineTo(
        x+s.size,
        y+s.size
    );

    ctx.closePath();

    ctx.fillStyle="#f2f2f2";

    ctx.fill();

    ctx.strokeStyle="#9ba8ff";

    ctx.stroke();
}


/* =========================
   DRAW PAD
========================= */

function drawPad(p){

    const x=screenX(p.x);

    const y=screenY(p.y);

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        x,
        y,
        p.w,
        p.h
    );

    ctx.fillStyle="#7285ff";

    ctx.fillRect(
        x+4,
        y+2,
        p.w-8,
        3
    );
}


/* =========================
   DRAW PORTAL
========================= */

function drawPortal(p){

    const x=screenX(p.x);

    if(x<-100 || x>W+100){
        return;
    }

    const y=H*.72-65;

    ctx.save();

    ctx.strokeStyle=
        p.type==="fast"
        ? "#ff5cf4"
        : "#5cf4ff";

    ctx.lineWidth=5;

    ctx.shadowBlur=20;

    ctx.shadowColor=ctx.strokeStyle;

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        28,
        65,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.restore();
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    const x=screenX(player.x);

    const y=screenY(player.y);


    for(const t of trail){

        const tx=screenX(t.x);

        const ty=screenY(t.y);

        ctx.save();

        ctx.globalAlpha=t.life/18*.18;

        ctx.translate(
            tx+player.size/2,
            ty+player.size/2
        );

        ctx.rotate(t.rotation);

        ctx.fillStyle="#ffffff";

        ctx.fillRect(
            -player.size/2,
            -player.size/2,
            player.size,
            player.size
        );

        ctx.restore();
    }


    ctx.save();

    ctx.translate(
        x+player.size/2,
        y+player.size/2
    );

    ctx.rotate(player.rotation);

    ctx.shadowBlur=18;

    ctx.shadowColor="#ffffff";

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        -player.size/2,
        -player.size/2,
        player.size,
        player.size
    );

    ctx.shadowBlur=0;

    ctx.fillStyle="#111526";

    ctx.fillRect(
        -9,
        -9,
        18,
        18
    );

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        -7,
        -5,
        4,
        4
    );

    ctx.fillRect(
        3,
        -5,
        4,
        4
    );

    ctx.restore();
}


/* =========================
   DRAW PARTICLES
========================= */

function drawParticles(){

    for(const p of particles){

        ctx.save();

        ctx.globalAlpha=
            Math.max(0,p.life/p.maxLife);

        ctx.fillStyle="#ffffff";

        ctx.fillRect(
            screenX(p.x),
            screenY(p.y),
            p.size,
            p.size
        );

        ctx.restore();
    }
}


/* =========================
   DRAW FINISH
========================= */

function drawFinish(){

    const x=screenX(levelLength-300);

    if(x<-100 || x>W+100){
        return;
    }

    ctx.save();

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=3;

    ctx.shadowBlur=25;

    ctx.shadowColor="#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        screenY(0)
    );

    ctx.lineTo(
        x,
        screenY(280)
    );

    ctx.stroke();

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        screenY(270)
    );

    ctx.lineTo(
        x+90,
        screenY(230)
    );

    ctx.lineTo(
        x,
        screenY(190)
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.save();

    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

        shake*=.88;

        if(shake<.2){
            shake=0;
        }
    }

    drawBackground();

    for(const p of platforms){
        drawPlatform(p);
    }

    for(const b of blocks){
        drawPlatform(b);
    }

    for(const s of spikes){
        drawSpike(s);
    }

    for(const p of pads){
        drawPad(p);
    }

    for(const p of portals){
        drawPortal(p);
    }

    drawFinish();

    drawParticles();

    drawPlayer();

    ctx.restore();
}


/* =========================
   GAME LOOP
========================= */

let last=performance.now();

function loop(now){

    const dt=Math.min(
        (now-last)/16.666,
        2
    );

    last=now;

    if(
        gameStarted &&
        !gameOver &&
        !completed
    ){

        for(let i=0;i<dt;i++){
            updatePlayer();
        }

        updateCamera();

        updateUI();

        if(player.x>=levelLength){
            finish();
        }
    }

    updateParticles();

    draw();

    requestAnimationFrame(loop);
}


/* =========================
   INITIAL STATE
========================= */

player.y=0;

player.grounded=true;

showMessage(
    "DASHLINE",
    "CLICK OR PRESS SPACE TO START"
);

requestAnimationFrame(loop);

</script>

</body>
</html>
